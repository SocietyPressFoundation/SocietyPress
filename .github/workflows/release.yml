name: Release

# Cuts a GitHub Release whenever a v*.*.* tag is pushed.
#
# What it does:
#   1. Builds societypress-<version>.zip with the same flat structure
#      the v1.0.0 release uses:
#         societypress/societypress.php
#         societypress/languages/societypress.pot
#   2. Extracts the CHANGELOG section for the matching version and uses
#      it as the release body. Falls back to the tag name if no section
#      is found.
#   3. Creates the GitHub Release as the latest stable (not prerelease,
#      not draft) and attaches the zip as the sole asset.
#
# This is the path the in-app updater consumes — sp_get_github_release()
# reads /releases/latest and looks for the societypress-*.zip asset.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # needed to create releases and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Resolve version from tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: "Verify plugin Version header matches the tag"
        env:
          EXPECTED: ${{ steps.ver.outputs.version }}
        run: |
          # Pull the `* Version: X.Y.Z` line from the plugin's header docblock.
          plugin_version=$(grep -E '^[[:space:]]*\*[[:space:]]*Version:' Code/plugin/societypress.php \
                           | head -n1 \
                           | sed -E 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//')
          constant_version=$(grep "define( 'SOCIETYPRESS_VERSION'" Code/plugin/societypress.php \
                             | head -n1 \
                             | sed -E "s/.*'SOCIETYPRESS_VERSION',[[:space:]]*'([^']+)'.*/\1/")
          echo "tag version:      $EXPECTED"
          echo "header version:   $plugin_version"
          echo "constant version: $constant_version"
          if [ "$plugin_version" != "$EXPECTED" ] || [ "$constant_version" != "$EXPECTED" ]; then
            echo "::error::Tag $EXPECTED doesn't match plugin Version header ($plugin_version) or SOCIETYPRESS_VERSION constant ($constant_version)."
            echo "Bump both in Code/plugin/societypress.php before tagging."
            exit 1
          fi

      - name: Build societypress-<version>.zip
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # This zip is what WordPress installs when a society clicks Update.
          # WordPress DELETES the existing plugin directory and extracts this in
          # its place, so a file missing here is not merely absent from a new
          # install — it is removed from a site that was working.
          #
          # That is what happened from v1.0.0 to v1.1.11: the assets directory
          # was never staged, so every update stripped the CSS, JavaScript and
          # icons the plugin loads at runtime. Nothing failed and nothing warned;
          # the plugin went on requesting files that were no longer there and the
          # browser quietly 404'd them. The photo viewer stopped opening, the
          # public events pages lost their styling, the editor's table and picture
          # buttons and the governance member pickers stopped responding, and the
          # web-app icons disappeared.
          #
          # Fresh installs were unaffected throughout, which is why it went
          # unnoticed for eleven releases — scripts/deploy.sh builds the
          # installer bundle separately and has always included assets/.
          #
          # Shape:
          #   societypress/societypress.php
          #   societypress/assets/...              (everything sp_asset_url() serves)
          #   societypress/languages/societypress.pot
          mkdir -p stage/societypress/languages
          cp Code/plugin/societypress.php             stage/societypress/societypress.php
          if [ -f Code/plugin/languages/societypress.pot ]; then
            cp Code/plugin/languages/societypress.pot stage/societypress/languages/societypress.pot
          fi
          if [ -d Code/plugin/assets ]; then
            cp -r Code/plugin/assets                  stage/societypress/assets
          fi
          ( cd stage && zip -rq "../societypress-${VERSION}.zip" societypress )
          ls -la societypress-${VERSION}.zip

      - name: "Verify the zip carries everything the plugin loads at runtime"
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # WHY a check and not just the fixed copy above: the bug this guards
          # against produced no error for eleven releases. A build that silently
          # omits a file looks exactly like a build that succeeds, so the only
          # thing that catches it is comparing what went in against what came
          # out. Anything added under Code/plugin/assets/ later is covered
          # automatically — there is no list here to keep in step.
          zip_name="societypress-${VERSION}.zip"
          status=0

          # unzip -Z1 lists one entry name per line and nothing else.
          unzip -Z1 "$zip_name" | sed -n 's|^societypress/||p' | sort > /tmp/in_zip.txt

          if ! grep -qx 'societypress.php' /tmp/in_zip.txt; then
            echo "::error::${zip_name} has no societypress.php."
            status=1
          fi

          if [ -f Code/plugin/languages/societypress.pot ] \
             && ! grep -qx 'languages/societypress.pot' /tmp/in_zip.txt; then
            echo "::error::${zip_name} is missing languages/societypress.pot."
            status=1
          fi

          if [ -d Code/plugin/assets ]; then
            ( cd Code/plugin && find assets -type f | sort ) > /tmp/expected_assets.txt
            # Trailing '/' entries are the directories zip stores; drop them
            # so the comparison is file-against-file.
            grep '^assets/' /tmp/in_zip.txt | grep -v '/$' | sort > /tmp/zipped_assets.txt

            if ! diff -u /tmp/expected_assets.txt /tmp/zipped_assets.txt > /tmp/assets_diff.txt; then
              echo "::error::${zip_name} does not carry the same asset files as Code/plugin/assets."
              echo "Lines starting '-' are in the repository but missing from the zip:"
              cat /tmp/assets_diff.txt
              status=1
            else
              echo "assets: $(wc -l < /tmp/expected_assets.txt) file(s), all present."
            fi
          fi

          if [ "$status" -ne 0 ]; then
            echo "A society updating from inside WordPress would have lost the files listed above."
            exit 1
          fi

          echo "$zip_name carries everything the plugin loads at runtime."

      - name: Extract CHANGELOG section for this version
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          notes_file="release-notes.md"
          # Pull from the first `## [VERSION]` heading up to (but not including)
          # the next `## [` heading or the `---` separator.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1; print; next}
            found && /^## \[/ {found=0}
            found && /^---[[:space:]]*$/ {found=0}
            found {print}
          ' CHANGELOG.md > "$notes_file"
          # Strip the leading heading — GitHub uses the release title for that.
          sed -i '/^## \[/d' "$notes_file"
          # If empty, fall back to a generic line.
          if [ ! -s "$notes_file" ]; then
            echo "SocietyPress $VERSION." > "$notes_file"
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload the zip
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION:  ${{ steps.ver.outputs.version }}
          TAG:      ${{ steps.ver.outputs.tag }}
        run: |
          title="SocietyPress ${VERSION}"
          # If the release already exists (e.g. a re-run), upload instead of recreating.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading asset (clobber on)."
            gh release upload "$TAG" "societypress-${VERSION}.zip" --clobber
          else
            gh release create "$TAG" \
              --title "$title" \
              --notes-file "release-notes.md" \
              --latest \
              "societypress-${VERSION}.zip"
          fi
